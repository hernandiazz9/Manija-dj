<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANIJA - Landing Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: #000;
            overflow: hidden; /* Evita el scroll */
        }

        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Usamos tu imagen de GitHub */
            background-image: url('IMG_5370.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Capa oscura opcional para que el texto resalte más si la imagen es muy clara */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .content {
            text-align: center;
            z-index: 10;
        }

        h1 {
            color: #fff;
            font-size: 8rem; /* Tamaño grande para MANIJA */
            letter-spacing: 5px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .social-icons {
            display: flex;
            gap: 25px;
            justify-content: center;
        }

        .social-icons a {
            color: #fff;
            font-size: 2.5rem;
            text-decoration: none;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .social-icons a:hover {
            transform: scale(1.2);
            opacity: 0.8;
        }

        /* Responsivo para móviles */
        @media (max-width: 768px) {
            h1 {
                font-size: 4rem;
            }
            .social-icons a {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="background-container">
        <div class="overlay">
            <div class="content">
                <h1>MANIJA</h1>
                
                <div class="social-icons">
                    <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
                    <a href="#" target="_blank"><i class="fab fa-youtube"></i></a>
                    <a href="#" target="_blank"><i class="fab fa-spotify"></i></a>
                    <a href="#" target="_blank"><i class="fab fa-soundcloud"></i></a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANIJA DJ - Landing Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Reseteo basico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Contenedor principal que simula la pantalla */
        .screen-container {
            width: 90%;
            max-width: 1200px;
            aspect-ratio: 16 / 9;
            background-image: url('https://replicate.delivery/xezq/l60VfI88aI77H5U55e512R3417V50E2E12H415R17V11H18E2E/out-0.png');
            background-size: cover;
            background-position: center;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        /* Titulo principal */
        .title {
            font-size: 8vw;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* Contenedor de los botones */
        .buttons-container {
            display: flex;
            gap: 20px;
        }

        /* Estilo de los botones */
        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 60px;
            height: 60px;
            border: 2px solid white;
            border-radius: 12px;
            color: white;
            font-size: 28px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        /* Efecto hover en los botones */
        .btn:hover {
            background-color: white;
            color: #1a1a1a;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="screen-container">
        <h1 class="title">MANIJA</h1>
        <div class="buttons-container">
            <a href="#" class="btn" target="_blank" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="#" class="btn" target="_blank" aria-label="YouTube">
                <i class="fab fa-youtube"></i>
            </a>
            <a href="#" class="btn" target="_blank" aria-label="Spotify">
                <i class="fab fa-spotify"></i>
            </a>
            <a href="#" class="btn" target="_blank" aria-label="SoundCloud">
                <i class="fab fa-soundcloud"></i>
            </a>
        </div>
    </div>

</body>
</html>
